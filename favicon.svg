<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!-- Outer blue ring -->
  <circle cx="48" cy="48" r="44" fill="none" stroke="#0b67c2" stroke-width="8" />
  <!-- Inner gold ring -->
  <circle cx="48" cy="48" r="34" fill="#ffffff" stroke="#d4af37" stroke-width="6" />
  <!-- Center white disc -->
  <circle cx="48" cy="48" r="26" fill="#ffffff" />
  <!-- Decorative small gold accent at top -->
  <path d="M48 22 L52 30 L44 30 Z" fill="#d4af37" />
  <!-- Letters P and S - uses common serif fallback -->
  <text x="50%" y="58" font-family="Georgia, 'Times New Roman', Times, serif" font-size="34" font-weight="700" fill="#0b67c2" text-anchor="middle" dominant-baseline="middle">PS</text>
  <!-- Red accents under letters -->
  <circle cx="36" cy="62" r="2" fill="#c62828" />
  <circle cx="60" cy="62" r="2" fill="#c62828" />
</svg>
